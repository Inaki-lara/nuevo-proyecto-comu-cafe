<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | BlogDeCafé</title>
    <meta name="description"
        content="Ponete en contacto con el equipo de BlogDeCafe. Envianos tus dudas, sugerencias o consultas sobre nuestros cursos de cafe y talleres de barismo.">
    <meta name="keywords" content="contacto blogdecafe, consultas cafe, soporte cursos cafe, enviar mensaje barista">
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <!-- Bootsrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos -->
    <link rel="Preload" href="../css/normalize.css" as="style">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="Preload" href="../css/style.css" as="style">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
</head>

<body>

    <header class="header">
        <div class="contenedor">
            <div class="barra">
                <nav class="navbar navbar-expand-lg navbar-dark bg-transparent w-100">
                    <div class="container-fluid p-0">
                        <a class="logo text-decoration-none" href="../index.html">
                            <p class="logo__nombre no-margin centrar-texto">Blog<span class="logo__bold">DeCafé</span>
                            </p>
                        </a>
                        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                            data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false"
                            aria-label="Navegación">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse justify-content-end" id="menuPrincipal">
                            <ul class="navbar-nav gap-3 text-center mt-3 mt-lg-0">
                                <li class="nav-item">
                                    <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
                                </li>
                                <li class="nav-item">
                                    <a class="navegacion__enlace" href="cursos.html">Cursos</a>
                                </li>
                                <li class="nav-item">
                                    <a class="navegacion__enlace" href="contacto.html">Contacto</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        <div class="header__texto">
            <h1 class="no-margin">Contacto</h1>
            <p class="no-margin">Escribinos y resuelve todas tus dudas con nosotros</p>
        </div>
    </header>

    <main class="contenedor my-5">
        <h2 class="centrar-texto">Envianos un mensaje</h2>
        <div class="contacto-bg"></div>

        <form class="formulario" action="#">
            <div class="campo">
                <label class="campo__label" for="nombre">Nombre</label>
                <input class="campo__field" type="text" placeholder="Tu Nombre" id="nombre" name="nombre" required>
            </div>
            <div class="campo">
                <label class="campo__label" for="email">Mail</label>
                <input class="campo__field" type="email" placeholder="Tu Correo" id="email" name="email" required>
            </div>
            <div class="campo">
                <label class="campo__label" for="mensaje">Mensaje</label>
                <textarea class="campo__field campo__field--textarea" id="mensaje" name="mensaje"
                    placeholder="Escribi tu mensaje aca..." required></textarea>
            </div>
            <div class="campo">
                <input type="submit" value="Enviar" class="boton boton--primario">
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="contenedor">
            <div class="barra">
                <a class="logo" href="../index.html">
                    <p class="logo__nombre no-margin centrar-texto">Blog<span class="logo__bold">DeCafé</span> </p>
                </a>
                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
